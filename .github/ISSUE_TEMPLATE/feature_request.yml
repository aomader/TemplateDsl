name: Feature request
description: Something TemplateDsl should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The template or app you're writing, and where TemplateDsl gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How it could look
      description: The code you'd like to write, if you have an idea.
      render: csharp
